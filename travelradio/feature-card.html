<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Travel Radio Australia</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="hero">

    <img class="logo"
         src="images/travel-radio-logo.png"
         alt="Travel Radio Australia">

    <div class="feature-card">

        <div class="photo">

            <img src="interviews/bruce-roszard/bruce-roszard.png"
                 alt="Bruce Roszard">

        </div>

        <div class="content">

            <img class="company-logo"
                 src="interviews/bruce-roszard/arival-logo.png"
                 alt="ARIVAL">

            <span class="badge">

                FEATURED INTERVIEW

            </span>

            <h1>Bruce Roszard</h1>

            <h3>Co-Founder | ARIVAL</h3>

            <p>

                Building the future of the Experiences Economy and why innovation is transforming tourism worldwide.

            </p>

            <div class="details">

                <span>📍 Brisbane</span>

                <span>🎤 ARIVAL 360</span>

                <span>📅 July 2026</span>

                <span>⏱ 18 Minutes</span>

            </div>

            <audio controls>

                <source src="interviews/bruce-roszard/bruce-roszard.mp3"
                        type="audio/mpeg">

            </audio>

            <div class="buttons">

                <a href="interviews/bruce-roszard/transcript.html"
                   target="_blank">

                    Read Transcript

                </a>

                <a href="interviews/bruce-roszard/transcript.pdf"
                   target="_blank">

                    Download PDF

                </a>

            </div>

        </div>

    </div>

</div>

</body>

</html>
